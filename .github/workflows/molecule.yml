---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
        scenario:
          - default
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: mozhi

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: mozhi/.python-version
          cache: pip
          cache-dependency-path: mozhi/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: mozhi
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('mozhi/molecule/*/requirements.yml') }}

      - name: Run Molecule
        working-directory: mozhi
        run: molecule test --scenario-name ${{ matrix.scenario }}

  # The self-build scenario compiles Mozhi from source inside the test
  # container, which is slow, and its result only moves when either upstream's
  # `master` or the ref this role pins moves. Running it on every push would
  # spend several minutes of the shared runner pool on a build whose inputs did
  # not change, so it is gated on a `*_version:` line in defaults/main.yml
  # having changed - and can always be started by hand.
  selfbuild-gate:
    name: Decide whether the self-build scenario needs to run
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Look for a version bump
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'Started by hand'
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" > /dev/null; then
            echo "No origin/$DEFAULT_BRANCH to compare against; running to be safe"
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff "origin/$DEFAULT_BRANCH...HEAD" -- defaults/main.yml | grep -E '^\+[A-Za-z0-9_]+_version:' || true)"

          if [ -n "$changed" ]; then
            echo "A version changed:"
            echo "$changed"
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No version line in defaults/main.yml changed'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

  molecule-selfbuild:
    name: Run Molecule scenario 'default-selfbuild' on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: selfbuild-gate
    if: needs.selfbuild-gate.outputs.needed == 'true'

    strategy:
      matrix:
        distro:
          - ubuntu2604
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: mozhi

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: mozhi/.python-version
          cache: pip
          cache-dependency-path: mozhi/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: mozhi
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('mozhi/molecule/default-selfbuild/requirements.yml') }}

      - name: Run Molecule
        working-directory: mozhi
        run: molecule test --scenario-name default-selfbuild
