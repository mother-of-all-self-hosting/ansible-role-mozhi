---
# What this scenario is for, and what it deliberately leaves to `default`:
#
# The two scenarios drive the same role with the same configuration, so there
# is no point in re-running the whole of `default`'s verification here. What is
# unique to this one is the image: it is built on the machine from Mozhi's
# source at the ref `mozhi_container_image_self_build_repo_version` pins,
# rather than pulled from `codeberg.org/aryak/mozhi:latest`. Those two can be a
# long way apart - upstream's `latest` is republished only when its own
# pipeline runs, and has been many months behind `master` before.
#
# So this scenario checks the self-build path end to end (the source is where
# the role put it, at the ref it pins; the container runs an image built from
# it and not the registry one), and then checks that the Mozhi that came out of
# that build honours the role's configuration just like the released one does.
# The negative control against an unconfigured Mozhi lives in `default`, which
# runs on every push, rather than being repeated in this bump-gated scenario.

- name: Verify a self-built Mozhi
  hosts: all
  become: true
  gather_facts: false

  vars:
    mozhi_verify_url: "http://127.0.0.1:{{ mozhi_container_http_host_bind_port }}"

    # Kept identical to `default`'s, deliberately: a self-built Mozhi built
    # from a newer `master` must still answer with the same engine list for the
    # same configuration, and this is where a change to Mozhi's `EngineList`
    # would first show up.
    mozhi_verify_expected_engines:
      - all
      - deepl
      - duckduckgo
      - libre
      - mymemory
      - reverso
      - some
      - yandex

    mozhi_verify_page_markers:
      - "name=\"engine\" value=\"{{ mozhi_environment_variables_mozhi_default_engine }}\""
      - "<option value=\"{{ mozhi_environment_variables_mozhi_default_source_lang }}\" selected>"
      - "<option value=\"{{ mozhi_environment_variables_mozhi_default_target_lang }}\" selected>"

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: mozhi_defaults

    # ------------------------------------------------------------------
    # The unit is up
    # ------------------------------------------------------------------

    - name: Wait for the Mozhi systemd service to become active (up to 180s)
      ansible.builtin.systemd_service:
        name: mozhi.service
      register: mozhi_service
      until: mozhi_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the Mozhi systemd service is active
      ansible.builtin.assert:
        that: mozhi_service.status.ActiveState == 'active'
        fail_msg: "The Mozhi systemd service is {{ mozhi_service.status.ActiveState }}"
        success_msg: "The Mozhi systemd service is active"

    - name: Retrieve the service logs for debugging
      when: mozhi_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mozhi.service
      changed_when: false

    - name: Read the Mozhi container the role created
      ansible.builtin.command:
        cmd: "docker container inspect {{ mozhi_molecule_container }}"
      register: mozhi_container_raw
      changed_when: false

    - name: Make sense of the Mozhi container
      ansible.builtin.set_fact:
        mozhi_container: "{{ (mozhi_container_raw.stdout | from_json)[0] }}"

    # ------------------------------------------------------------------
    # The source is where the role put it, at the ref the role pins
    # ------------------------------------------------------------------

    # `ansible.builtin.git` can clone and check out, but it cannot read an
    # existing checkout back, which is what these three need to do.
    - name: Read the commit the self-build source checkout is at  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git -C {{ mozhi_molecule_selfbuild_src_path }} rev-parse HEAD"
      register: mozhi_selfbuild_head
      changed_when: false

    - name: Read the commit the pinned ref points at  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git -C {{ mozhi_molecule_selfbuild_src_path }} rev-parse {{ mozhi_defaults.mozhi_container_image_self_build_repo_version }}"
      register: mozhi_selfbuild_pinned
      changed_when: false

    - name: Read the remote the self-build source checkout came from  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git -C {{ mozhi_molecule_selfbuild_src_path }} remote get-url origin"
      register: mozhi_selfbuild_remote
      changed_when: false

    - name: Assert the self-build source is Mozhi, at the ref the role pins
      ansible.builtin.assert:
        that:
          - mozhi_selfbuild_remote.stdout | trim == mozhi_defaults.mozhi_container_image_self_build_repo
          - mozhi_selfbuild_head.stdout | trim == mozhi_selfbuild_pinned.stdout | trim
        fail_msg: >-
          The self-build checkout at {{ mozhi_molecule_selfbuild_src_path }} is
          not what the role says it should be: remote
          {{ mozhi_selfbuild_remote.stdout | trim }} (expected
          {{ mozhi_defaults.mozhi_container_image_self_build_repo }}), HEAD
          {{ mozhi_selfbuild_head.stdout | trim }} while
          `{{ mozhi_defaults.mozhi_container_image_self_build_repo_version }}`
          points at {{ mozhi_selfbuild_pinned.stdout | trim }}
        success_msg: >-
          The self-build checkout is
          {{ mozhi_defaults.mozhi_container_image_self_build_repo }} at
          {{ mozhi_selfbuild_head.stdout | trim }}, which is what
          `{{ mozhi_defaults.mozhi_container_image_self_build_repo_version }}`
          points at

    # ------------------------------------------------------------------
    # The container runs the image that was built here, not the registry one
    # ------------------------------------------------------------------

    - name: Read the image the Mozhi container runs
      ansible.builtin.command:
        cmd: "docker image inspect {{ mozhi_container.Config.Image }} --format {{ '{{.Id}}' }}"
      register: mozhi_image_id
      changed_when: false

    - name: Assert the container runs the self-built image
      vars:
        mozhi_verify_expected_image: >-
          {{ mozhi_molecule_selfbuild_image_repository }}:{{ mozhi_defaults.mozhi_container_image_self_build_repo_version }}
      ansible.builtin.assert:
        that:
          - mozhi_container.Config.Image == mozhi_verify_expected_image
          - not mozhi_container.Config.Image.startswith(mozhi_defaults.mozhi_container_image_registry_prefix_upstream_default)
          - mozhi_container.Image == mozhi_image_id.stdout | trim
        fail_msg: >-
          The container does not run the self-built image: it runs
          {{ mozhi_container.Config.Image }} (expected
          {{ mozhi_verify_expected_image }}), created from
          {{ mozhi_container.Image }} while that name now points at
          {{ mozhi_image_id.stdout | trim }}
        success_msg: >-
          The container runs {{ mozhi_container.Config.Image }} - built here
          from the pinned source, not pulled from
          {{ mozhi_defaults.mozhi_container_image_registry_prefix_upstream_default }} -
          and it was created from the image that name points at right now

    # ------------------------------------------------------------------
    # The Mozhi that came out of that build honours the role's configuration
    # ------------------------------------------------------------------

    # An unconfigured Mozhi listens on 3000, so getting an answer on the port
    # this scenario asks for means MOZHI_PORT reached the process the role
    # built. The `default` scenario demonstrates that fallback against a stock
    # image; it is not repeated here.
    - name: Wait for the self-built Mozhi to answer on the port the role configured (up to 3m)
      ansible.builtin.uri:
        url: "{{ mozhi_verify_url }}/api/engines"
        status_code: [200, -1]
      register: mozhi_engines
      until: mozhi_engines.status == 200
      retries: 36
      delay: 5

    - name: Retrieve the self-built Mozhi's front page
      ansible.builtin.uri:
        url: "{{ mozhi_verify_url }}/"
        return_content: true
        follow_redirects: none
        status_code: [200]
      register: mozhi_index

    - name: Ask the self-built Mozhi what it was built with
      ansible.builtin.uri:
        url: "{{ mozhi_verify_url }}/api/version"
        status_code: [200]
      register: mozhi_build_info

    - name: Assert the self-built Mozhi honours the role's configuration
      ansible.builtin.assert:
        that:
          - mozhi_engines.json.keys() | sort | list == mozhi_verify_expected_engines
          - mozhi_verify_page_markers | select('in', mozhi_index.content) | list == mozhi_verify_page_markers
          - "'TZ=' ~ mozhi_environment_variables_tz in mozhi_container.Config.Env"
          - "'MOZHI_USER_AGENT=MASH-Molecule-Verify' in mozhi_container.Config.Env"
        fail_msg: >-
          The self-built Mozhi does not reflect the role's configuration:
          engines={{ mozhi_engines.json.keys() | sort | list }} (expected
          {{ mozhi_verify_expected_engines }}), missing front page markers
          {{ mozhi_verify_page_markers | reject('in', mozhi_index.content) | list }}
        success_msg: >-
          The self-built Mozhi answers on port {{ mozhi_container_http_port }},
          offers exactly {{ mozhi_verify_expected_engines }} and preselects the
          engine and languages the role configured

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # so `active` on its own says very little - and a build from `master` is
    # exactly where a Mozhi that no longer starts would first turn up.
    - name: Sample the restart counter
      ansible.builtin.systemd_service:
        name: mozhi.service
      register: mozhi_restarts_before

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the service for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the restart counter again
      ansible.builtin.systemd_service:
        name: mozhi.service
      register: mozhi_restarts_after

    - name: Assert the self-built Mozhi did not restart while it was up
      ansible.builtin.assert:
        that: mozhi_restarts_after.status.NRestarts == mozhi_restarts_before.status.NRestarts
        fail_msg: >-
          Mozhi restarted while it was supposedly up, so `active` was hiding a
          crash loop (restarts went from
          {{ mozhi_restarts_before.status.NRestarts }} to
          {{ mozhi_restarts_after.status.NRestarts }})
        success_msg: >-
          Mozhi did not restart over 45 seconds of watching (restarts so far:
          {{ mozhi_restarts_after.status.NRestarts }})

    - name: Show the self-build verification summary
      ansible.builtin.debug:
        msg:
          - "systemd: mozhi.service is {{ mozhi_service.status.ActiveState }}"
          - "source: {{ mozhi_defaults.mozhi_container_image_self_build_repo }} at {{ mozhi_selfbuild_head.stdout | trim }}"
          - "image: {{ mozhi_container.Config.Image }} ({{ mozhi_container.Image }}), built with {{ mozhi_build_info.json }}"
          - "engines: {{ mozhi_engines.json.keys() | sort | list }}"
