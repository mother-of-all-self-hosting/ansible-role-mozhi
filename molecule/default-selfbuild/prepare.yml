---
- name: Prepare Mozhi Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Mozhi Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Mozhi Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Mozhi Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

    # Mounted into the container read-only through the role's own
    # `mozhi_container_additional_volumes`. Mozhi never reads it; it only has to
    # be there for the mount to be checked in `docker inspect`. See verify.yml.
    - name: Ensure the directory mounted through the role's additional volumes exists
      ansible.builtin.file:
        path: "{{ mozhi_molecule_extra_path }}"
        state: directory
        mode: "0755"
