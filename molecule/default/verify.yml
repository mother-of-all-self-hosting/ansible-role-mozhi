---
- name: Verify Mozhi
  hosts: all
  become: true
  gather_facts: false

  vars:
    mozhi_verify_url: "http://127.0.0.1:{{ mozhi_container_http_host_bind_port }}"

    # The name carries both the role and the scenario, like the platform does,
    # so a leftover container can never be mistaken for another scenario's.
    mozhi_verify_control_container: "{{ inventory_hostname }}-negative-control"
    mozhi_verify_control_url: "http://127.0.0.1:{{ mozhi_molecule_control_port }}"

    # What `/api/engines` returns for this scenario's configuration, and what
    # it returns for a Mozhi that was told nothing at all. The two differ in
    # both directions, which is what makes the configured one evidence:
    #
    # - `google` is missing here because the scenario sets
    #   MOZHI_GOOGLE_ENABLED=false
    # - `libre` is present here because the scenario sets a
    #   MOZHI_LIBRETRANSLATE_URL, and absent from an unconfigured instance
    #   because Mozhi hides LibreTranslate when no URL is set for it
    #
    # Only Google is switched off, because Mozhi's engine list is built by a
    # single if/else-if chain (`EngineList` in its utils/main.go): the first
    # engine it finds switched off is removed and none of the remaining
    # branches are looked at. Asserting on more than one switch at a time
    # would be asserting something Mozhi cannot do. See
    # docs/configuring-mozhi.md.
    mozhi_verify_expected_engines:
      - all
      - deepl
      - duckduckgo
      - libre
      - mymemory
      - reverso
      - some
      - yandex
    mozhi_verify_control_expected_engines:
      - all
      - deepl
      - duckduckgo
      - google
      - mymemory
      - reverso
      - some
      - yandex

    # What the served page looks like when the role's env file has arrived...
    mozhi_verify_page_markers:
      - "name=\"engine\" value=\"{{ mozhi_environment_variables_mozhi_default_engine }}\""
      - "<option value=\"{{ mozhi_environment_variables_mozhi_default_source_lang }}\" selected>"
      - "<option value=\"{{ mozhi_environment_variables_mozhi_default_target_lang }}\" selected>"

    # ...and what it looks like when it has not. Mozhi falls back to `google`
    # as the engine, `auto` as the source language and `en` as the target
    # language, none of which this scenario asks for.
    mozhi_verify_control_page_markers:
      - "name=\"engine\" value=\"google\""
      - "<option value=\"auto\" selected>"
      - "<option value=\"en\" selected>"

  tasks:
    # Role defaults are not in scope in a verify play, but the version the role
    # installs lives in them and is what the running container is checked
    # against below. Only leaf literals may be read out of this - anything
    # Jinja-derived would be resolved against an empty namespace. Loading it
    # under a name of its own also keeps it from outranking the scenario's own
    # group_vars, which is what the assertions further down compare against.
    - name: Load the Mozhi role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: mozhi_defaults

    # ------------------------------------------------------------------
    # The unit is up
    # ------------------------------------------------------------------

    - name: Wait for the Mozhi systemd service to become active (up to 180s)
      ansible.builtin.systemd_service:
        name: mozhi.service
      register: mozhi_service
      until: mozhi_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the Mozhi systemd service is active
      ansible.builtin.assert:
        that: mozhi_service.status.ActiveState == 'active'
        fail_msg: "The Mozhi systemd service is {{ mozhi_service.status.ActiveState }}"
        success_msg: "The Mozhi systemd service is active"

    - name: Retrieve the service logs for debugging
      when: mozhi_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mozhi.service
      changed_when: false

    - name: Read the Mozhi container the role created
      ansible.builtin.command:
        cmd: "docker inspect {{ mozhi_molecule_container }}"
      register: mozhi_container_raw
      changed_when: false

    - name: Make sense of the Mozhi container
      ansible.builtin.set_fact:
        mozhi_container: "{{ (mozhi_container_raw.stdout | from_json)[0] }}"

    # ------------------------------------------------------------------
    # The negative control: the same image, without the role's doing
    # ------------------------------------------------------------------

    # Mozhi is a front-end for third-party translation engines, so nothing here
    # may depend on any of them answering - and nothing here does. Mozhi
    # compiles its language lists in (they are generated into libmozhi's source
    # as Go literals) and computes its engine list from environment variables
    # alone, so the whole served UI renders with no network access at all. Only
    # an actual translation request leaves the machine, and this scenario never
    # makes one.
    #
    # What is checked instead is what the role configured, and that is only
    # evidence if the stock image does not serve the same things unaided. It
    # does not - but note that it does answer 200 on `/`, which is why a 200 is
    # not treated as proof of anything here.
    - name: Probe a Mozhi that the role has not configured
      block:
        - name: Start a Mozhi with none of the role's configuration
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --detach
              - --rm
              - --name
              - "{{ mozhi_verify_control_container }}"
              - --network
              - "{{ mozhi_molecule_container_network }}"
              - --publish
              - "127.0.0.1:{{ mozhi_molecule_control_port }}:{{ mozhi_molecule_control_container_port }}"
              - "{{ mozhi_container.Config.Image }}"
          changed_when: true

        - name: Wait for the unconfigured Mozhi to come up (up to 3m)
          ansible.builtin.uri:
            url: "{{ mozhi_verify_control_url }}/api/engines"
            status_code: [200, -1]
          register: mozhi_control_engines
          until: mozhi_control_engines.status == 200
          retries: 36
          delay: 5

        - name: Ask the unconfigured Mozhi for its front page
          ansible.builtin.uri:
            url: "{{ mozhi_verify_control_url }}/"
            return_content: true
            follow_redirects: none
            status_code: [200]
          register: mozhi_control_index
      always:
        - name: Stop the unconfigured Mozhi
          ansible.builtin.command:
            argv:
              - docker
              - rm
              - --force
              - "{{ mozhi_verify_control_container }}"
          changed_when: true

    - name: Assert the unconfigured Mozhi serves none of what the role configures
      ansible.builtin.assert:
        that:
          - mozhi_control_engines.json.keys() | sort | list == mozhi_verify_control_expected_engines
          - mozhi_verify_page_markers | reject('in', mozhi_control_index.content) | list == mozhi_verify_page_markers
          - mozhi_verify_control_page_markers | select('in', mozhi_control_index.content) | list == mozhi_verify_control_page_markers
        fail_msg: >-
          The unconfigured Mozhi already serves what this role is supposed to
          configure, so nothing below can be credited to the role:
          engines={{ mozhi_control_engines.json.keys() | sort | list }},
          page markers found={{ mozhi_verify_page_markers | select('in', mozhi_control_index.content) | list }}
        success_msg: >-
          The unconfigured Mozhi offers a different set of engines
          ({{ mozhi_control_engines.json.keys() | sort | list }}), and its front
          page preselects Google, `auto` and `en` rather than anything this
          scenario asks for - so everything below is the role's doing

    # ------------------------------------------------------------------
    # The role's Mozhi is up, on the port the role gave it
    # ------------------------------------------------------------------

    # Getting an answer here at all is the first assertion: an unconfigured
    # Mozhi listens on 3000 (the control above just demonstrated it), and this
    # scenario asks for a different port. Mozhi only listens there if MOZHI_PORT
    # came through the role's env file, through `--env-file`, and through
    # Mozhi's own parsing.
    - name: Wait for Mozhi to answer on the port the role configured (up to 3m)
      ansible.builtin.uri:
        url: "{{ mozhi_verify_url }}/api/engines"
        status_code: [200, -1]
      register: mozhi_engines
      until: mozhi_engines.status == 200
      retries: 36
      delay: 5

    - name: Assert Mozhi listens on the port the role configured
      vars:
        mozhi_verify_port_key: "{{ mozhi_container_http_port }}/tcp"
      ansible.builtin.assert:
        that:
          - mozhi_engines.status == 200
          - mozhi_verify_port_key in mozhi_container.NetworkSettings.Ports
          - mozhi_container.NetworkSettings.Ports[mozhi_verify_port_key][0].HostPort == mozhi_container_http_host_bind_port | string
        fail_msg: >-
          Mozhi did not answer on port {{ mozhi_container_http_port }}, or the
          container does not publish it:
          {{ mozhi_container.NetworkSettings.Ports }}
        success_msg: >-
          Mozhi answers on port {{ mozhi_container_http_port }} rather than on
          the 3000 it falls back to, so MOZHI_PORT reached the process, and the
          container publishes it on host port
          {{ mozhi_container_http_host_bind_port }}

    # ------------------------------------------------------------------
    # Configuration reaches the process, not just the files on disk
    # ------------------------------------------------------------------

    - name: Assert Mozhi offers the engines the role configured
      ansible.builtin.assert:
        that:
          - mozhi_engines.json.keys() | sort | list == mozhi_verify_expected_engines
        fail_msg: >-
          Mozhi offers {{ mozhi_engines.json.keys() | sort | list }}, but the
          role's env file asked for {{ mozhi_verify_expected_engines }}
        success_msg: >-
          Mozhi offers exactly {{ mozhi_verify_expected_engines }} - Google gone
          because the role switched it off, LibreTranslate present because the
          role gave it a URL, the reverse of the unconfigured instance

    # A second, entirely separate surface for the same env file: the front page
    # is rendered from the MOZHI_DEFAULT_* settings at request time rather than
    # computed from the engine switches.
    - name: Retrieve the Mozhi front page
      ansible.builtin.uri:
        url: "{{ mozhi_verify_url }}/"
        return_content: true
        follow_redirects: none
        status_code: [200]
      register: mozhi_index

    - name: Assert the Mozhi front page offers the role's defaults
      ansible.builtin.assert:
        that:
          - mozhi_verify_page_markers | select('in', mozhi_index.content) | list == mozhi_verify_page_markers
        fail_msg: >-
          The front page does not preselect the role's defaults (engine
          {{ mozhi_environment_variables_mozhi_default_engine }}, source
          {{ mozhi_environment_variables_mozhi_default_source_lang }}, target
          {{ mozhi_environment_variables_mozhi_default_target_lang }}); missing
          markers: {{ mozhi_verify_page_markers | reject('in', mozhi_index.content) | list }}
        success_msg: >-
          The front page preselects the engine, source language and target
          language the role configured - a source language that Mozhi's own
          fallback (`auto`) is not even offered by this engine

    # Not every setting the role writes has a surface Mozhi reports back. These
    # two do not: the timezone is only visible to Mozhi's own clock, and the
    # user agent only to the outbound requests this scenario never makes. What
    # can still be checked for them is that the env file the role rendered
    # reached the container's environment - including the one that rides in
    # through `mozhi_environment_variables_additional_variables`, which is a
    # different path through the template than all the dedicated variables.
    - name: Assert the env file the role wrote reached the container environment
      ansible.builtin.assert:
        that:
          - "'TZ=' ~ mozhi_environment_variables_tz in mozhi_container.Config.Env"
          - "'MOZHI_USER_AGENT=MASH-Molecule-Verify' in mozhi_container.Config.Env"
        fail_msg: >-
          The container environment does not carry what the role's env file
          says: {{ mozhi_container.Config.Env }}
        success_msg: >-
          The container environment carries the timezone the role configured and
          the free-form setting passed through
          `mozhi_environment_variables_additional_variables`

    # And the labels file, which is a second file the role renders and hands to
    # Docker. No Traefik runs here, so what is checked is that the labels the
    # role generated are on the container - including the port, which is derived
    # from the same variable the process was just checked against.
    - name: Assert the labels file the role wrote reached the container
      vars:
        mozhi_verify_labels: "{{ mozhi_container.Config.Labels }}"
      ansible.builtin.assert:
        that:
          - mozhi_verify_labels['traefik.enable'] == 'true'
          - mozhi_verify_labels['traefik.http.routers.mozhi.rule'] == 'Host(`' ~ mozhi_hostname ~ '`)'
          - mozhi_verify_labels['traefik.http.services.mozhi.loadbalancer.server.port'] == mozhi_container_http_port | string
          - mozhi_verify_labels['traefik.docker.network'] == mozhi_molecule_container_network
        fail_msg: >-
          The container does not carry the Traefik labels the role rendered:
          {{ mozhi_verify_labels }}
        success_msg: >-
          The container carries the role's Traefik labels, routing
          {{ mozhi_hostname }} to port {{ mozhi_container_http_port }} on the
          {{ mozhi_molecule_container_network }} network

    # ------------------------------------------------------------------
    # The container runs the image its leaf variable names
    # ------------------------------------------------------------------

    # `mozhi_version` is the literal `latest` and will stay that way for as long
    # as Mozhi publishes no versioned images (see defaults/main.yml), so the tag
    # is all the leaf variable can be checked against.
    #
    # `latest` moves, so a second link is checked: that the container was
    # created from the image that tag points at right now, and not from a stale
    # one left over from an earlier pull. There is no honest third link to
    # check - Mozhi's own `/api/version` reports the version of the Fiber
    # framework and of the Go toolchain it was built with, not a Mozhi version,
    # and the image carries no OCI labels at all. That absence is exactly why
    # this role does not automerge version bumps; see .github/renovate.json.
    - name: Read the image the Mozhi container runs
      ansible.builtin.command:
        cmd: "docker image inspect {{ mozhi_container.Config.Image }} --format {{ '{{.Id}}' }}"
      register: mozhi_image_id
      changed_when: false

    - name: Ask Mozhi what it was built with
      ansible.builtin.uri:
        url: "{{ mozhi_verify_url }}/api/version"
        status_code: [200]
      register: mozhi_build_info

    - name: Assert the Mozhi container runs the image the role names
      ansible.builtin.assert:
        that:
          - mozhi_container.Config.Image | split(':') | last == mozhi_defaults.mozhi_version
          - mozhi_container.Image == mozhi_image_id.stdout | trim
          - mozhi_build_info.json.goversion | length > 0
          - mozhi_build_info.json.fiberversion | length > 0
        fail_msg: >-
          The running Mozhi does not match what the role installs: container
          image {{ mozhi_container.Config.Image }} (expected the
          `{{ mozhi_defaults.mozhi_version }}` tag), created from
          {{ mozhi_container.Image }} while that tag now points at
          {{ mozhi_image_id.stdout | trim }}; build info
          {{ mozhi_build_info.json }}
        success_msg: >-
          The container runs {{ mozhi_container.Config.Image }}, the tag
          `mozhi_version` names, and it was created from the image that tag
          points at right now; the process reports it was built with
          {{ mozhi_build_info.json.goversion }} against Fiber
          {{ mozhi_build_info.json.fiberversion }}

    # ------------------------------------------------------------------
    # The container is shaped the way the role's unit file says
    # ------------------------------------------------------------------

    - name: Assert the Mozhi container is hardened and wired up as the role specifies
      vars:
        mozhi_verify_extra_mount: >-
          {{
            mozhi_container.Mounts
            | selectattr('Destination', 'eq', mozhi_molecule_extra_path_in_container)
            | list
          }}
      ansible.builtin.assert:
        that:
          - mozhi_container.HostConfig.ReadonlyRootfs
          - mozhi_container.HostConfig.CapDrop == ['ALL']
          - mozhi_container.Config.User == mozhi_uid ~ ':' ~ mozhi_gid
          - mozhi_container.NetworkSettings.Networks.keys() | list == [mozhi_molecule_container_network]
          # `mozhi_container_additional_volumes` was declared by the role but
          # never rendered into the unit file, so this is what keeps the mount
          # from silently disappearing again.
          - mozhi_verify_extra_mount | length == 1
          - mozhi_verify_extra_mount[0].Source == mozhi_molecule_extra_path
          - not mozhi_verify_extra_mount[0].RW
        fail_msg: >-
          The Mozhi container is not shaped as the unit file specifies:
          read-only rootfs={{ mozhi_container.HostConfig.ReadonlyRootfs }},
          dropped capabilities={{ mozhi_container.HostConfig.CapDrop }},
          user={{ mozhi_container.Config.User }},
          networks={{ mozhi_container.NetworkSettings.Networks.keys() | list }},
          mounts={{ mozhi_container.Mounts }}
        success_msg: >-
          The Mozhi container runs read-only as
          {{ mozhi_container.Config.User }} with all capabilities dropped, on
          the {{ mozhi_molecule_container_network }} network, with the role's
          additional volume mounted read-only at
          {{ mozhi_molecule_extra_path_in_container }}

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # so `active` on its own says very little. The window has to be watched with
    # everything already answering.
    - name: Sample the restart counter
      ansible.builtin.systemd_service:
        name: mozhi.service
      register: mozhi_restarts_before

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the service for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the restart counter again
      ansible.builtin.systemd_service:
        name: mozhi.service
      register: mozhi_restarts_after

    - name: Assert Mozhi did not restart while it was up
      ansible.builtin.assert:
        that: mozhi_restarts_after.status.NRestarts == mozhi_restarts_before.status.NRestarts
        fail_msg: >-
          Mozhi restarted while it was supposedly up, so `active` was hiding a
          crash loop (restarts went from
          {{ mozhi_restarts_before.status.NRestarts }} to
          {{ mozhi_restarts_after.status.NRestarts }})
        success_msg: >-
          Mozhi did not restart over 45 seconds of watching (restarts so far:
          {{ mozhi_restarts_after.status.NRestarts }})

    - name: Show the Mozhi verification summary
      ansible.builtin.debug:
        msg:
          - "systemd: mozhi.service is {{ mozhi_service.status.ActiveState }}"
          - "unconfigured image: engines={{ mozhi_control_engines.json.keys() | sort | list }}"
          - "configured: engines={{ mozhi_engines.json.keys() | sort | list }}"
          - "front page markers: {{ mozhi_verify_page_markers }}"
          - "image: {{ mozhi_container.Config.Image }} ({{ mozhi_container.Image }}), built with {{ mozhi_build_info.json }}"
